name: Lint & Format Check

on: [pull_request, push]

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install clang-format
        run: |
          python -m pip install -r scripts/requirements-dev.txt
          clang-format --version

      - name: Check C/C++ formatting
        run: |
          find include src tests \
            -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.c' \) \
            | xargs clang-format --dry-run --Werror

      - name: Check CMake format and lint
        run: python scripts/check_cmake.py

      - name: Check Vulkan dependency pins
        run: python scripts/check_vulkan_stack.py

      - name: Run script tests
        run: python -m pytest scripts/tests -v

