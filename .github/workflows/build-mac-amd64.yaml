name: Build rexglue-sdk mac-amd64

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/_build-platform.yaml
    with:
      platform: mac-amd64
      ref: ${{ github.ref }}
      publish_mode: ${{ github.ref_type == 'tag' && 'release' || 'artifact' }}
      artifact_name: mac-amd64
    secrets: inherit
