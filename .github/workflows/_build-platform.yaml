name: Build platform (reusable)

on:
  workflow_call:
    inputs:
      platform:
        description: "win-amd64 | win-arm64 | mac-amd64 | mac-arm64 | linux-amd64 | linux-arm64"
        required: true
        type: string
      ref:
        description: "Git ref (SHA or tag) to check out and build"
        required: true
        type: string
      publish_mode:
        description: "'release' to upload as a GitHub release asset, 'artifact' to upload as a workflow artifact"
        required: true
        type: string
      artifact_name:
        description: "Artifact name when publish_mode is 'artifact'"
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: "Derived build version string (REXGLUE_VERSION_STRING)"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ${{ fromJSON('{"win-amd64":"windows-latest","win-arm64":"windows-11-arm","mac-amd64":"macos-26-intel","mac-arm64":"macos-26","linux-amd64":"ubuntu-latest","linux-arm64":"ubuntu-24.04-arm"}')[inputs.platform] }}
    outputs:
      version: ${{ steps.version.outputs.v }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install toolchain (Windows)
        if: inputs.platform == 'win-amd64'
        run: choco install llvm cmake ninja -y

      - name: Set up toolchain (Windows ARM64)
        if: inputs.platform == 'win-arm64'
        shell: pwsh
        run: |
          # windows-11-arm ships native ARM64 LLVM/Clang, CMake and Ninja, plus
          # VS 2022 (MSVC ARM64 libraries + Windows SDK). No download needed; just
          # ensure LLVM is on PATH and surface versions for diagnostics.
          $llvm = 'C:\Program Files\LLVM\bin'
          if (Test-Path $llvm) {
            Add-Content -Path $env:GITHUB_PATH -Value $llvm
            $env:PATH = "$llvm;$env:PATH"
          }
          clang --version
          clang++ --version
          cmake --version
          ninja --version

      - name: Install clang 20 (Linux)
        if: startsWith(inputs.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-20 lld-20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install build deps (macOS)
        if: startsWith(inputs.platform, 'mac-')
        run: brew install cmake ninja vulkan-loader molten-vk

      - name: Install build deps (linux-amd64)
        if: inputs.platform == 'linux-amd64'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list http://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt update
          sudo apt install -y cmake ninja-build build-essential git curl unzip autoconf python3.12-venv \
            libgtk-3-dev libx11-xcb-dev libxss-dev vulkan-sdk \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Install build deps (linux-arm64)
        if: inputs.platform == 'linux-arm64'
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build build-essential git curl unzip autoconf python3.12-venv \
            libgtk-3-dev libx11-xcb-dev libxss-dev libvulkan-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: ${{ inputs.platform }}

      - name: Configure
        env:
          CC: ${{ fromJSON('{"win-amd64":"clang","win-arm64":"clang","mac-amd64":"/usr/bin/clang","mac-arm64":"/usr/bin/clang","linux-amd64":"clang-20","linux-arm64":"clang-20"}')[inputs.platform] }}
          CXX: ${{ fromJSON('{"win-amd64":"clang++","win-arm64":"clang++","mac-amd64":"/usr/bin/clang++","mac-arm64":"/usr/bin/clang++","linux-amd64":"clang++-20","linux-arm64":"clang++-20"}')[inputs.platform] }}
        run: cmake --preset ${{ inputs.platform }} -DCMAKE_C_COMPILER="${{ env.CC }}" -DCMAKE_CXX_COMPILER="${{ env.CXX }}" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build and install
        run: cmake --build out/build/${{ inputs.platform }} --target install --parallel

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Read version
        id: version
        shell: bash
        run: |
          v=$(sed -nE 's/^#define REXGLUE_VERSION_STRING "([^"]+)".*/\1/p' \
            out/build/${{ inputs.platform }}/include/rex/version.h)
          echo "v=${v}" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: startsWith(inputs.platform, 'win-')
        shell: bash
        run: |
          cd out/install
          7z a "rexglue-sdk-${{ steps.version.outputs.v }}-${{ inputs.platform }}.zip" ${{ inputs.platform }}

      - name: Package (Unix)
        if: ${{ !startsWith(inputs.platform, 'win-') }}
        run: |
          cd out/install
          zip -r "rexglue-sdk-${{ steps.version.outputs.v }}-${{ inputs.platform }}.zip" ${{ inputs.platform }}

      - name: Upload as release asset
        if: inputs.publish_mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/install/rexglue-sdk-*-${{ inputs.platform }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as workflow artifact
        if: inputs.publish_mode == 'artifact'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: out/install/rexglue-sdk-*-${{ inputs.platform }}.zip
          retention-days: 14
