name: Build platform (reusable)

on:
  workflow_call:
    inputs:
      platform:
        description: "win-amd64 | mac-amd64 | mac-arm64 | linux-amd64 | linux-arm64"
        required: true
        type: string
      ref:
        description: "Git ref (SHA or tag) to check out and build"
        required: true
        type: string
      publish_mode:
        description: "'release' to upload as a GitHub release asset, 'artifact' to upload as a workflow artifact"
        required: true
        type: string
      artifact_name:
        description: "Artifact name when publish_mode is 'artifact'"
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: "Derived build version string (REXGLUE_VERSION_STRING)"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ${{ fromJSON('{"win-amd64":"windows-latest","mac-amd64":"macos-26-intel","mac-arm64":"macos-26","linux-amd64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm"}')[inputs.platform] }}
    outputs:
      version: ${{ steps.version.outputs.v }}
    env:
      DEBIAN_FRONTEND: noninteractive
      VULKAN_SDK_VERSION: "1.4.363.1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install toolchain (Windows)
        if: inputs.platform == 'win-amd64'
        shell: pwsh
        run: |
          choco install cmake ninja -y
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          $llvm = Join-Path $vs "VC\Tools\Llvm\x64\bin"
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $llvm "clang.exe") --version

      - name: Install Vulkan SDK (Windows)
        if: inputs.platform == 'win-amd64'
        shell: pwsh
        run: |
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe" -OutFile vulkan_sdk.exe
          .\vulkan_sdk.exe --root $root --accept-licenses --default-answer --confirm-command install copy_only=1
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install clang 20 (linux)
        if: startsWith(inputs.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-20 lld-20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install build deps (macOS)
        if: startsWith(inputs.platform, 'mac-')
        run: brew install cmake ninja

      - name: Install Vulkan SDK (macOS)
        if: startsWith(inputs.platform, 'mac-')
        run: |
          root="$HOME/VulkanSDK/${VULKAN_SDK_VERSION}"
          curl -fsSL -o vulkan_sdk.zip "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/mac/vulkan_sdk.zip"
          unzip -q vulkan_sdk.zip
          installer=$(ls -d vulkansdk-*.app | head -n 1)
          sudo "${installer}/Contents/MacOS/${installer%.app}" --root "${root}" --accept-licenses --default-answer --confirm-command install copy_only=1
          before=$(env | sort)
          old_path="$PATH"
          source "${root}/setup-env.sh"
          after=$(env | sort)
          comm -13 <(echo "$before") <(echo "$after") | grep -v -e '^PATH=' -e '^_=' >> "$GITHUB_ENV"
          echo "${PATH%"$old_path"}" | tr ':' '\n' | sed '/^$/d' >> "$GITHUB_PATH"

      - name: Install build deps (linux-amd64)
        if: inputs.platform == 'linux-amd64'
        run: |
          sudo apt-get install -y cmake ninja-build build-essential git curl unzip zip autoconf python3-venv xz-utils \
            libgtk-3-dev libx11-xcb-dev libxss-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Install Vulkan SDK (linux-amd64)
        if: inputs.platform == 'linux-amd64'
        run: |
          curl -fsSL -o vulkan_sdk.tar.xz "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz"
          mkdir -p "$HOME/vulkan"
          tar -xf vulkan_sdk.tar.xz -C "$HOME/vulkan"
          before=$(env | sort)
          old_path="$PATH"
          source "$HOME/vulkan/${VULKAN_SDK_VERSION}/setup-env.sh"
          after=$(env | sort)
          comm -13 <(echo "$before") <(echo "$after") | grep -v -e '^PATH=' -e '^_=' >> "$GITHUB_ENV"
          echo "${PATH%"$old_path"}" | tr ':' '\n' | sed '/^$/d' >> "$GITHUB_PATH"

      - name: Install build deps (linux-arm64)
        if: inputs.platform == 'linux-arm64'
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build build-essential git curl unzip autoconf python3.12-venv \
            libgtk-3-dev libx11-xcb-dev libxss-dev libvulkan-dev libvulkan-memory-allocator-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: ${{ inputs.platform }}

      - name: Configure
        env:
          CC: ${{ fromJSON('{"win-amd64":"clang","mac-amd64":"/usr/bin/clang","mac-arm64":"/usr/bin/clang","linux-amd64":"clang-20","linux-arm64":"clang-20"}')[inputs.platform] }}
          CXX: ${{ fromJSON('{"win-amd64":"clang++","mac-amd64":"/usr/bin/clang++","mac-arm64":"/usr/bin/clang++","linux-amd64":"clang++-20","linux-arm64":"clang++-20"}')[inputs.platform] }}
        run: cmake --preset ${{ inputs.platform }} -DCMAKE_C_COMPILER="${{ env.CC }}" -DCMAKE_CXX_COMPILER="${{ env.CXX }}" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build and install
        run: cmake --build out/build/${{ inputs.platform }} --target install --parallel

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Read version
        id: version
        shell: bash
        run: |
          v=$(sed -nE 's/^#define REXGLUE_VERSION_STRING "([^"]+)".*/\1/p' \
            out/build/${{ inputs.platform }}/include/rex/version.h)
          echo "v=${v}" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: inputs.platform == 'win-amd64'
        shell: bash
        run: |
          cd out/install
          7z a "rexglue-sdk-${{ steps.version.outputs.v }}-${{ inputs.platform }}.zip" ${{ inputs.platform }}

      - name: Package (Unix)
        if: inputs.platform != 'win-amd64'
        run: |
          cd out/install
          zip -r "rexglue-sdk-${{ steps.version.outputs.v }}-${{ inputs.platform }}.zip" ${{ inputs.platform }}

      - name: Upload as release asset
        if: inputs.publish_mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/install/rexglue-sdk-*-${{ inputs.platform }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as workflow artifact
        if: inputs.publish_mode == 'artifact'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: out/install/rexglue-sdk-*-${{ inputs.platform }}.zip
          retention-days: 14
